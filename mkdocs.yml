site_name: AI Genius Episode 1 - 참가자 안내서
site_description: GitHub Copilot과 함께하는 AI 네이티브 개발 워크숍의 한국어 참가자 안내서입니다.
repo_url: https://github.com/KYUNGCMIN/AIGenius-GHCP-AINative-KR

nav:
  - 홈: index.md
  - 1장 - 이슈 작성하기: chapter-1-write-an-issue.md
  - 2장 - Copilot에 할당하기: chapter-2-assign-to-copilot.md
  - 3장 - PR 검토하기: chapter-3-review-a-pr.md
  - 4장 - 댓글로 반복 개선하기: chapter-4-iterate.md
  - 5장 - Azure와 AI: chapter-5-azure-and-ai.md
  - 참고 자료: resources.md

theme:
  name: material
  language: ko
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 어두운 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 밝은 모드로 전환

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css
